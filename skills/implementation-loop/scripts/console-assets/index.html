<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loop console</title>
  <link rel="stylesheet" href="/console.css">
</head>
<body>
  <header>
    <h1>Loop console</h1>
    <p id="shell-status">Inert shell. Open the printed console URL to authenticate.</p>
  </header>
  <main>
    <section id="section-now">
      <h2>Now</h2>
      <div id="now-root"></div>
    </section>
    <section id="section-run">
      <h2>This run</h2>
      <div id="run-root"></div>
    </section>
    <section id="section-dials">
      <h2>Dials</h2>
      <div id="dials-root"></div>
    </section>
  </main>
  <script src="/console.js"></script>
</body>
</html>
