name: selftest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n build.sh
          bash -n tests/build-selftest.sh
          bash -n skills/implementation-loop/backends/codex/dispatch.sh
          bash -n skills/implementation-loop/backends/codex/fixture-driver.sh
          bash -n skills/implementation-loop/backends/codex/selftest.sh
          bash -n skills/implementation-loop/backends/cursor/dispatch.sh
          bash -n skills/implementation-loop/backends/cursor/fixture-driver.sh
          bash -n skills/implementation-loop/backends/cursor/selftest.sh
          bash -n skills/implementation-loop/backends/grok/dispatch.sh
          bash -n skills/implementation-loop/backends/grok/fixture-driver.sh
          bash -n skills/implementation-loop/backends/grok/selftest.sh
          bash -n skills/implementation-loop/backends/grok/verify-worktree.sh
          bash -n skills/implementation-loop/scripts/codex-dispatch.sh
          bash -n skills/implementation-loop/scripts/cursor-dispatch.sh
          bash -n skills/implementation-loop/scripts/cursor-selftest.sh
          bash -n skills/implementation-loop/scripts/grok-dispatch.sh
          bash -n skills/implementation-loop/scripts/grok-selftest.sh
          bash -n skills/implementation-loop/scripts/grok-verify-worktree.sh
          bash -n skills/implementation-loop/scripts/integration-test.sh
          bash -n skills/implementation-loop/scripts/loop-journal
          bash -n skills/implementation-loop/scripts/loop-run
          bash -n skills/implementation-loop/scripts/loop-index
          bash -n skills/implementation-loop/scripts/run-gate.sh
          bash -n skills/implementation-loop/scripts/selftest.sh
          bash -n skills/implementation-loop/tests/contract-core.sh
          bash -n skills/implementation-loop/tests/contract-negative.sh
          bash -n skills/implementation-loop/tests/gate-selftest.sh
          bash -n skills/implementation-loop/tests/integration-test.sh
          bash -n skills/implementation-loop/tests/journal-selftest.sh
          bash -n skills/implementation-loop/tests/index-selftest.sh
          bash -n skills/implementation-loop/tests/shim-selftest.sh
          bash -n cursor-implementation-loop/skills/cursor-implementation-loop/scripts/run-gate.sh
          bash -n cursor-implementation-loop/skills/cursor-implementation-loop/scripts/gate-selftest.sh
          bash -n install-cursor.sh
          bash -n install-cursor-selftest.sh
      - name: Generated Cursor package is current
        run: bash build.sh --check
      - name: Cursor package build is deterministic
        run: |
          first_parent="$(mktemp -d)"
          second_parent="$(mktemp -d)"
          bash build.sh --out "$first_parent/package"
          bash build.sh --out "$second_parent/package"
          python3 tests/build-inventory.py "$first_parent/package" \
            > "$first_parent/inventory.tsv"
          python3 tests/build-inventory.py "$second_parent/package" \
            > "$second_parent/inventory.tsv"
          diff -u "$first_parent/inventory.tsv" "$second_parent/inventory.tsv"
      - name: Cursor package build selftest
        run: bash tests/build-selftest.sh
      - name: Shared playbooks stay platform-neutral
        run: |
          ! grep -rnwE 'read-only|investigate' \
            skills/engineering-mode/references/playbooks/ \
            cursor-implementation-loop/skills/cursor-engineering-mode/references/playbooks/
          ! grep -rn 'codex-dispatch' \
            skills/engineering-mode/references/playbooks/ \
            cursor-implementation-loop/skills/cursor-engineering-mode/references/playbooks/
      - name: Codex backend selftest
        run: bash skills/implementation-loop/backends/codex/selftest.sh
      - name: Canonical gate selftest
        run: bash skills/implementation-loop/tests/gate-selftest.sh
      - name: Grok backend selftest
        run: bash skills/implementation-loop/backends/grok/selftest.sh
      - name: Cursor-agent backend selftest
        run: bash skills/implementation-loop/backends/cursor/selftest.sh
      - name: Dispatch contract conformance
        run: bash skills/implementation-loop/tests/contract-core.sh
      - name: Dispatch contract negative controls
        run: bash skills/implementation-loop/tests/contract-negative.sh
      - name: Forwarding shim compatibility
        run: bash skills/implementation-loop/tests/shim-selftest.sh
      - name: Journal core selftest
        run: bash skills/implementation-loop/tests/journal-selftest.sh
      - name: Index selftest
        run: bash skills/implementation-loop/tests/index-selftest.sh
      - name: Cursor gate selftest
        run: bash cursor-implementation-loop/skills/cursor-implementation-loop/scripts/gate-selftest.sh
      - name: Cursor installer selftest
        run: bash install-cursor-selftest.sh
      - name: Engineering mode packaging checks
        run: |
          bash -n skills/engineering-mode/scripts/tree-oid.sh
          bash -n skills/engineering-mode/scripts/tree-oid-selftest.sh
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          failed = False
          for path in (
              Path(".claude-plugin/marketplace.json"),
              Path(".cursor-plugin/marketplace.json"),
          ):
              try:
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"json: FAIL {path}: {exc}", file=sys.stderr)
                  failed = True
              else:
                  print(f"json: PASS {path}")
          if failed:
              raise SystemExit(1)
          PY
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          paths = sorted(Path("skills").glob("*/SKILL.md"))
          paths.extend(sorted(Path("cursor-implementation-loop/skills").glob("*/SKILL.md")))
          errors = []
          if not paths:
              errors.append("frontmatter: no skills/*/SKILL.md files found")
          for path in paths:
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "---":
                  errors.append(f"{path}: first line is not ---")
                  continue
              try:
                  end = lines.index("---", 1)
              except ValueError:
                  errors.append(f"{path}: frontmatter has no closing ---")
                  continue
              frontmatter = lines[1:end]

              def has_value(key):
                  for line in frontmatter:
                      match = re.match(rf"^{key}\s*:(.*)$", line)
                      if not match:
                          continue
                      value = match.group(1).strip()
                      if value.startswith("#"):
                          value = ""
                      elif value.startswith(("'", '"')):
                          closing = value.find(value[0], 1)
                          if closing != -1:
                              comment = re.search(r"\s+#", value[closing + 1:])
                              if comment:
                                  value = value[:closing + 1 + comment.start()].rstrip()
                      else:
                          value = re.split(r"\s+#", value, maxsplit=1)[0].rstrip()
                      if (
                          value.lower() not in {"", "''", '""', "null", "~"}
                          and not re.fullmatch(
                              r"[|>](?:[1-9][+-]?|[+-][1-9]?)?", value
                          )
                      ):
                          return True
                  return False

              missing = [
                  key
                  for key in ("name", "description")
                  if not has_value(key)
              ]
              if missing:
                  errors.append(f"{path}: missing frontmatter key(s): {', '.join(missing)}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f"frontmatter: PASS ({len(paths)} skill files)")
          PY
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path("skills/engineering-mode")
          paths = [root / "SKILL.md", *sorted((root / "references").glob("**/*.md"))]
          cursor_root = Path("cursor-implementation-loop/skills/cursor-engineering-mode")
          paths.extend([cursor_root / "SKILL.md", *sorted((cursor_root / "references").glob("**/*.md"))])
          loop_root = Path("skills/implementation-loop")
          paths.extend([loop_root / "SKILL.md", *sorted((loop_root / "references").glob("**/*.md"))])
          paths.extend(sorted((loop_root / "backends").glob("*/runtime.md")))
          patterns = (
              re.compile(r"!?\[[^\]\n]*\]\((<[^>\n]+>|[^)\n]+)\)"),
              re.compile(r"^\s*\[[^\]\n]+\]:\s*(<[^>\n]+>|\S+)", re.MULTILINE),
          )
          errors = []
          checked = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  for match in pattern.finditer(text):
                      raw = match.group(1).strip()
                      target = raw[1:raw.index(">")] if raw.startswith("<") else raw.split(maxsplit=1)[0]
                      target = target.split("#", 1)[0]
                      parsed = urlsplit(target)
                      if not target or parsed.scheme or parsed.netloc or target.startswith("/"):
                          continue
                      checked += 1
                      resolved = (path.parent / unquote(parsed.path)).resolve()
                      if not resolved.is_file():
                          line = text.count("\n", 0, match.start()) + 1
                          errors.append(f"{path}:{line}: dangling relative link: {raw} -> {resolved}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f"relative-links: PASS ({checked} links across {len(paths)} files)")
          PY

  tree-oid:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tree OID selftest
        run: bash skills/engineering-mode/scripts/tree-oid-selftest.sh
      - name: Cursor tree OID selftest
        run: bash cursor-implementation-loop/skills/cursor-engineering-mode/scripts/tree-oid-selftest.sh
