name: selftest
on:
  push:
    branches: [main]
  pull_request:
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n build.sh
          bash -n tests/build-selftest.sh
          bash -n skills/implementation-loop/backends/claude/dispatch.sh
          bash -n skills/implementation-loop/backends/claude/fixture-driver.sh
          bash -n skills/implementation-loop/backends/claude/selftest.sh
          bash -n skills/implementation-loop/backends/codex/dispatch.sh
          bash -n skills/implementation-loop/backends/codex/fixture-driver.sh
          bash -n skills/implementation-loop/backends/codex/selftest.sh
          bash -n skills/implementation-loop/backends/cursor/dispatch.sh
          bash -n skills/implementation-loop/backends/cursor/fixture-driver.sh
          bash -n skills/implementation-loop/backends/cursor/selftest.sh
          bash -n skills/implementation-loop/backends/grok/dispatch.sh
          bash -n skills/implementation-loop/backends/grok/fixture-driver.sh
          bash -n skills/implementation-loop/backends/grok/selftest.sh
          bash -n skills/implementation-loop/backends/grok/verify-worktree.sh
          bash -n skills/implementation-loop/scripts/codex-dispatch.sh
          bash -n skills/implementation-loop/scripts/cursor-dispatch.sh
          bash -n skills/implementation-loop/scripts/cursor-selftest.sh
          bash -n skills/implementation-loop/scripts/grok-dispatch.sh
          bash -n skills/implementation-loop/scripts/grok-selftest.sh
          bash -n skills/implementation-loop/scripts/grok-verify-worktree.sh
          bash -n skills/implementation-loop/scripts/integration-test.sh
          bash -n skills/implementation-loop/scripts/loop-journal
          bash -n skills/implementation-loop/scripts/loop-coordinator
          bash -n skills/implementation-loop/scripts/loop-run
          bash -n skills/implementation-loop/scripts/loop-index
          bash -n skills/implementation-loop/scripts/loop-console
          bash -n skills/implementation-loop/scripts/loop-calibration
          bash -n skills/implementation-loop/scripts/loop-evidence
          bash -n skills/implementation-loop/scripts/loop-authority
          bash -n skills/implementation-loop/scripts/loop-authority-verify
          bash -n skills/implementation-loop/scripts/run-gate.sh
          bash -n skills/implementation-loop/scripts/selftest.sh
          bash -n skills/implementation-loop/tests/contract-core.sh
          bash -n skills/implementation-loop/tests/contract-negative.sh
          bash -n skills/implementation-loop/tests/gate-selftest.sh
          bash -n skills/implementation-loop/tests/integration-test.sh
          bash -n skills/implementation-loop/tests/journal-selftest.sh
          bash -n skills/implementation-loop/tests/coordinator-selftest.sh
          bash -n skills/implementation-loop/tests/index-selftest.sh
          bash -n skills/implementation-loop/tests/reduce-selftest.sh
          bash -n skills/implementation-loop/tests/console-selftest.sh
          bash -n skills/implementation-loop/tests/calibration-selftest.sh
          bash -n skills/implementation-loop/tests/evidence-selftest.sh
          bash -n skills/implementation-loop/tests/authority-selftest.sh
          bash -n skills/implementation-loop/tests/registry-selftest.sh
          bash -n skills/implementation-loop/tests/refs-selftest.sh
          bash -n skills/implementation-loop/tests/falsifier-selftest.sh
          bash -n skills/implementation-loop/tests/shim-selftest.sh
          bash -n cursor-implementation-loop/skills/cursor-implementation-loop/scripts/run-gate.sh
          bash -n cursor-implementation-loop/skills/cursor-implementation-loop/scripts/gate-selftest.sh
          bash -n install-cursor.sh
          bash -n install-cursor-selftest.sh
      - name: Generated Cursor package is current
        run: bash build.sh --check
      - name: Cursor package build is deterministic
        run: |
          first_parent="$(mktemp -d)"
          second_parent="$(mktemp -d)"
          bash build.sh --out "$first_parent/package"
          bash build.sh --out "$second_parent/package"
          python3 tests/build-inventory.py "$first_parent/package" \
            > "$first_parent/inventory.tsv"
          python3 tests/build-inventory.py "$second_parent/package" \
            > "$second_parent/inventory.tsv"
          diff -u "$first_parent/inventory.tsv" "$second_parent/inventory.tsv"
      - name: Cursor package build selftest
        run: bash tests/build-selftest.sh
      - name: Shared playbooks stay platform-neutral
        run: |
          ! grep -rnwE 'read-only|investigate' \
            skills/engineering-mode/references/playbooks/ \
            cursor-implementation-loop/skills/cursor-engineering-mode/references/playbooks/
          ! grep -rn 'codex-dispatch' \
            skills/engineering-mode/references/playbooks/ \
            cursor-implementation-loop/skills/cursor-engineering-mode/references/playbooks/
      - name: Codex backend selftest
        run: bash skills/implementation-loop/backends/codex/selftest.sh
      - name: Canonical gate selftest
        run: bash skills/implementation-loop/tests/gate-selftest.sh
      - name: Grok backend selftest
        run: bash skills/implementation-loop/backends/grok/selftest.sh
      - name: Cursor-agent backend selftest
        run: bash skills/implementation-loop/backends/cursor/selftest.sh
      - name: Claude backend selftest
        run: bash skills/implementation-loop/backends/claude/selftest.sh
      - name: Dispatch contract conformance
        run: bash skills/implementation-loop/tests/contract-core.sh
      - name: Dispatch contract negative controls
        run: bash skills/implementation-loop/tests/contract-negative.sh
      - name: Forwarding shim compatibility
        run: bash skills/implementation-loop/tests/shim-selftest.sh
      - name: Journal core selftest
        run: bash skills/implementation-loop/tests/journal-selftest.sh
      - name: Index selftest
        run: bash skills/implementation-loop/tests/index-selftest.sh
      - name: Reducer selftest
        run: bash skills/implementation-loop/tests/reduce-selftest.sh
      - name: Authority review regression controls
        run: python3 skills/implementation-loop/tests/authority-review-selftest.py
      - name: Authority store selftest
        run: bash skills/implementation-loop/tests/authority-selftest.sh
      - name: Authority registry selftest
        run: bash skills/implementation-loop/tests/registry-selftest.sh
      - name: Reference observation regression controls
        run: python3 skills/implementation-loop/tests/refs-review-selftest.py
      - name: Claimed-reference verification selftest
        run: bash skills/implementation-loop/tests/refs-selftest.sh
      - name: Falsifier
        run: bash skills/implementation-loop/tests/falsifier-selftest.sh
      - name: Console selftest
        run: bash skills/implementation-loop/tests/console-selftest.sh
      - name: Calibration selftest
        run: bash skills/implementation-loop/tests/calibration-selftest.sh
      - name: Evidence card selftest
        run: bash skills/implementation-loop/tests/evidence-selftest.sh
      - name: Coordinator selftest
        run: bash skills/implementation-loop/tests/coordinator-selftest.sh
      - name: Cursor gate selftest
        run: bash cursor-implementation-loop/skills/cursor-implementation-loop/scripts/gate-selftest.sh
      - name: Cursor installer selftest
        run: bash install-cursor-selftest.sh
      - name: Engineering mode packaging checks
        run: |
          bash -n skills/engineering-mode/scripts/tree-oid.sh
          bash -n skills/engineering-mode/scripts/tree-oid-selftest.sh
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          failed = False
          for path in (
              Path(".claude-plugin/marketplace.json"),
              Path(".cursor-plugin/marketplace.json"),
          ):
              try:
                  with path.open(encoding="utf-8") as handle:
                      json.load(handle)
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"json: FAIL {path}: {exc}", file=sys.stderr)
                  failed = True
              else:
                  print(f"json: PASS {path}")
          if failed:
              raise SystemExit(1)
          PY
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          paths = sorted(Path("skills").glob("*/SKILL.md"))
          paths.extend(sorted(Path("cursor-implementation-loop/skills").glob("*/SKILL.md")))
          errors = []
          if not paths:
              errors.append("frontmatter: no skills/*/SKILL.md files found")
          for path in paths:
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "---":
                  errors.append(f"{path}: first line is not ---")
                  continue
              try:
                  end = lines.index("---", 1)
              except ValueError:
                  errors.append(f"{path}: frontmatter has no closing ---")
                  continue
              frontmatter = lines[1:end]

              def has_value(key):
                  for line in frontmatter:
                      match = re.match(rf"^{key}\s*:(.*)$", line)
                      if not match:
                          continue
                      value = match.group(1).strip()
                      if value.startswith("#"):
                          value = ""
                      elif value.startswith(("'", '"')):
                          closing = value.find(value[0], 1)
                          if closing != -1:
                              comment = re.search(r"\s+#", value[closing + 1:])
                              if comment:
                                  value = value[:closing + 1 + comment.start()].rstrip()
                      else:
                          value = re.split(r"\s+#", value, maxsplit=1)[0].rstrip()
                      if (
                          value.lower() not in {"", "''", '""', "null", "~"}
                          and not re.fullmatch(
                              r"[|>](?:[1-9][+-]?|[+-][1-9]?)?", value
                          )
                      ):
                          return True
                  return False

              missing = [
                  key
                  for key in ("name", "description")
                  if not has_value(key)
              ]
              if missing:
                  errors.append(f"{path}: missing frontmatter key(s): {', '.join(missing)}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f"frontmatter: PASS ({len(paths)} skill files)")
          PY
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path("skills/engineering-mode")
          paths = [root / "SKILL.md", *sorted((root / "references").glob("**/*.md"))]
          cursor_root = Path("cursor-implementation-loop/skills/cursor-engineering-mode")
          paths.extend([cursor_root / "SKILL.md", *sorted((cursor_root / "references").glob("**/*.md"))])
          loop_root = Path("skills/implementation-loop")
          paths.extend([loop_root / "SKILL.md", *sorted((loop_root / "references").glob("**/*.md"))])
          paths.extend(sorted((loop_root / "backends").glob("*/runtime.md")))
          patterns = (
              re.compile(r"!?\[[^\]\n]*\]\((<[^>\n]+>|[^)\n]+)\)"),
              re.compile(r"^\s*\[[^\]\n]+\]:\s*(<[^>\n]+>|\S+)", re.MULTILINE),
          )
          errors = []
          checked = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for pattern in patterns:
                  for match in pattern.finditer(text):
                      raw = match.group(1).strip()
                      target = raw[1:raw.index(">")] if raw.startswith("<") else raw.split(maxsplit=1)[0]
                      target = target.split("#", 1)[0]
                      parsed = urlsplit(target)
                      if not target or parsed.scheme or parsed.netloc or target.startswith("/"):
                          continue
                      checked += 1
                      resolved = (path.parent / unquote(parsed.path)).resolve()
                      if not resolved.is_file():
                          line = text.count("\n", 0, match.start()) + 1
                          errors.append(f"{path}:{line}: dangling relative link: {raw} -> {resolved}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f"relative-links: PASS ({checked} links across {len(paths)} files)")
          PY

  # The authority crash matrix: every frame-byte cut of genesis frame 1, of
  # an epoch-rotation frame, and of the active epoch's revocation frame (the
  # compound with its quarantine: each cut must recover to the record and the
  # exact quarantine marker, or neither with the old epoch still active). A
  # frame's length follows the ceremony's pid, tty, and start-time digits, so
  # one plan job probes the three planned sizes N and every shard enumerates
  # the same cut list from them: <kind>:frame-byte-n for n from 1 to N - 2
  # (torn prefixes), then <kind>:frame-byte-last. A run's frame need not be N
  # bytes long. A shard credits byte n only to a real crash of that kind at
  # exactly offset n of a frame of at least n + 2 bytes, so n is never the
  # final byte, and "last" only to a crash at its own frame's final byte;
  # other runs are discarded and retried (up to 50), then the cut fails. Each
  # shard records every credited cut's evidence (kind, frame length, crash
  # offset), which the coverage job checks against the plan, and prints a
  # classifier sweep over every prefix of each real frame its runs wrote,
  # which the coverage job does not need. Re-genesis frames keep sampled real
  # bytes and the full classifier sweep in the default authority selftest.
  crash-matrix-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sizes: ${{ steps.plan.outputs.sizes }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe the three frames the crash matrix enumerates
        id: plan
        run: |
          set -o pipefail
          bash skills/implementation-loop/tests/authority-selftest.sh --crash-matrix --plan | tee plan.log
          sizes="$(sed -n 's/^# crash matrix sizes=//p' plan.log)"
          [[ "$sizes" =~ ^[1-9][0-9]*,[1-9][0-9]*,[1-9][0-9]*$ ]]
          echo "sizes=$sizes" >> "$GITHUB_OUTPUT"

  crash-matrix:
    needs: crash-matrix-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD: ${{ matrix.shard }}
      SIZES: ${{ needs.crash-matrix-plan.outputs.sizes }}
    steps:
      - uses: actions/checkout@v4
      - name: Authority crash matrix, one shard of 8
        run: |
          bash skills/implementation-loop/tests/authority-selftest.sh --crash-matrix \
            --shard "$SHARD/8" --sizes "$SIZES" --cut-ids-out "cut-ids-$SHARD-of-8.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-matrix-cut-ids-${{ matrix.shard }}
          path: cut-ids-${{ matrix.shard }}-of-8.txt
          if-no-files-found: error

  crash-matrix-coverage:
    needs: [crash-matrix-plan, crash-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAN: ${{ needs.crash-matrix-plan.result }}
      SHARDS: ${{ needs.crash-matrix.result }}
      SIZES: ${{ needs.crash-matrix-plan.outputs.sizes }}
    steps:
      - uses: actions/checkout@v4
      - name: The plan and all 8 shards succeeded
        run: |
          echo "plan: $PLAN, shards: $SHARDS"
          [[ "$PLAN" == success && "$SHARDS" == success ]]
      - uses: actions/download-artifact@v4
        with:
          pattern: crash-matrix-cut-ids-*
          path: cut-ids
          merge-multiple: true
      - name: The shards' credited cuts and their evidence cover the full cut list
        run: |
          bash skills/implementation-loop/tests/authority-selftest.sh --crash-matrix \
            --check-shards cut-ids --sizes "$SIZES"

  authority-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Authority review regression controls
        run: python3 skills/implementation-loop/tests/authority-review-selftest.py
      - name: Reference observation regression controls
        run: python3 skills/implementation-loop/tests/refs-review-selftest.py
      - name: Authority store and Darwin start-token regressions
        run: bash skills/implementation-loop/tests/authority-selftest.sh

  tree-oid:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tree OID selftest
        run: bash skills/engineering-mode/scripts/tree-oid-selftest.sh
      - name: Cursor tree OID selftest
        run: bash cursor-implementation-loop/skills/cursor-engineering-mode/scripts/tree-oid-selftest.sh
